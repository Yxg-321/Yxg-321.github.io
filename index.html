<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个用来整理思路、记录学习过程的个人博客">
  <link rel="icon" href="assets/images/avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-pagetitle="首页">

  <header class="site-nav" id="siteNav">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <img class="brand-avatar" src="assets/images/avatar.jpg" alt="">
        <span data-site="title"></span>
      </a>
      <nav class="nav-links">
        <a href="index.html" data-ico="home">首页</a>
        <a href="archive.html" data-ico="archive">归档</a>
        <a href="guestbook.html" data-ico="guestbook">留言</a>
        <a href="about.html" data-ico="about">关于</a>
      </nav>
    </div>
  </header>

  <section class="hero hero-home" data-site-bg>
    <div class="hero-mask"></div>
    <div class="hero-content">
      <img class="hero-avatar" src="assets/images/avatar.jpg" alt="头像" data-site-avatar>
      <h1 class="hero-title" data-site="title"></h1>
      <p class="hero-subtitle" data-site="subtitle"></p>
      <div class="hero-divider"></div>
      <p class="hero-slogan" data-site="slogan"></p>
    </div>
    <a class="hero-scroll" href="#main" aria-label="向下滚动">▾</a>
  </section>

  <main class="site-shell" id="main">
    <aside class="sidebar">
      <section class="card profile-card reveal">
        <img class="profile-avatar" src="assets/images/avatar.jpg" alt="" data-site-avatar>
        <h3 class="profile-name" data-site="owner"></h3>
        <p class="profile-slogan" data-site="slogan"></p>
        <div class="profile-stats">
          <div><b id="statPosts">–</b><span>文章</span></div>
          <div><b id="statCats">–</b><span>分类</span></div>
          <div><b id="statTags">–</b><span>标签</span></div>
        </div>
      </section>
    </aside>

    <section class="content">
      <div class="filter-bar reveal" id="filterBar"></div>
      <div class="post-list" id="postList"></div>
      <div class="empty-state" id="emptyState" hidden>
        <p>这里还没有文章。</p>
        <p class="empty-hint">前往 <a href="admin.html">管理后台</a> 发布第一篇吧。</p>
      </div>
      <p class="data-source" id="dataSource" hidden></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span data-site="since"></span> - <span data-site="year"></span> <span data-site="owner"></span> · <span data-site="title"></span></p>
    <p class="footer-sub"><span data-site="footerNote"></span> · <a href="admin.html">管理入口</a></p>
  </footer>

  <script src="assets/js/marked.min.js"></script>
  <script src="assets/js/highlight.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
